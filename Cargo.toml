[workspace]
members = [
  "crates/factor_core",
  "crates/factor_io",
  "crates/factor_cli",
  "crates/llm_local",
  "crates/report",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.1.0"
authors = ["FactorLens"]

[workspace.dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
csv = "1.3"
nalgebra = "0.33"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "0.8"
postgres = "0.19"
postgres-rustls = "0.13"
rustls = "0.23"
rustls-native-certs = "0.8"
