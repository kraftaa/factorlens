apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: factorlens-mcp
  namespace: analytics
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
spec:
  # Optional: only needed when clients are outside the cluster.
  # For in-cluster clients, use Service DNS directly:
  # http://factorlens-mcp.analytics.svc.cluster.local/mcp
  tls:
  - hosts:
    - mcp.your-internal-domain.example
    secretName: factorlens-mcp-tls
  rules:
  - host: mcp.your-internal-domain.example
    http:
      paths:
      - path: /mcp
        pathType: Prefix
        backend:
          service:
            name: factorlens-mcp
            port:
              number: 80
