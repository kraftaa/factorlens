apiVersion: v1
kind: Secret
metadata:
  name: factorlens-mcp-secrets
  namespace: analytics
stringData:
  # optional: if omitted, the app can use pod-level DATABASE_URL env or query-specific --postgres-url
  DATABASE_URL: "postgresql://user:password@host:5432/dbname"
  # optional: if not using IRSA/Workload Identity
  AWS_ACCESS_KEY_ID: ""
  AWS_SECRET_ACCESS_KEY: ""
  AWS_SESSION_TOKEN: ""
