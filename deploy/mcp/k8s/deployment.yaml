apiVersion: apps/v1
kind: Deployment
metadata:
  name: factorlens-mcp
  namespace: analytics
  labels:
    app: factorlens-mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: factorlens-mcp
  template:
    metadata:
      labels:
        app: factorlens-mcp
    spec:
      # Set to your IRSA/workload-identity enabled service account for Bedrock access.
      serviceAccountName: factorlens-mcp-sa
      containers:
      - name: factorlens-mcp
        image: ghcr.io/kraftaa/factorlens-mcp:latest
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8000
        env:
        - name: FACTORLENS_BIN
          value: /app/bin/factorlens
        envFrom:
        - configMapRef:
            name: factorlens-mcp-config
        - secretRef:
            name: factorlens-mcp-secrets
            optional: true
        volumeMounts:
        - name: data
          mountPath: /data
          readOnly: true
        - name: profiles
          mountPath: /profiles
          readOnly: true
        - name: artifacts
          mountPath: /artifacts
        - name: db-ca
          mountPath: /certs
          readOnly: true
        readinessProbe:
          tcpSocket:
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          tcpSocket:
            port: http
          initialDelaySeconds: 15
          periodSeconds: 20
        resources:
          requests:
            cpu: "250m"
            memory: "512Mi"
          limits:
            cpu: "2"
            memory: "2Gi"
      volumes:
      - name: data
        emptyDir: {}
      - name: profiles
        emptyDir: {}
      - name: artifacts
        emptyDir: {}
      - name: db-ca
        secret:
          secretName: factorlens-db-ca
          optional: true
