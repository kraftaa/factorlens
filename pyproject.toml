[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "factorlens"
version = "4.1.4"
description = "Factor attribution and analytics CLI"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
  { name = "Maria Dubyaga", email = "kraftaa@gmail.com" }
]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Rust",
  "Topic :: Office/Business :: Financial",
  "Topic :: Scientific/Engineering :: Information Analysis"
]

[tool.maturin]
bindings = "bin"
manifest-path = "crates/factor_cli/Cargo.toml"
strip = true

[project.urls]
Homepage = "https://github.com/kraftaa/factorlens"
Repository = "https://github.com/kraftaa/factorlens"
