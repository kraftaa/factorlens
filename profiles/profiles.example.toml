# Example profile config for `factorlens analyze --profile-config ...`

[profiles.exec_custom]
# Use real column names from your own CSV
# group_by = ["region", "channel"]
# metrics = ["revenue_usd"]
# rank_by = "revenue_usd"
# top = 12
# min_records = 20

[profiles.generic_segment]
group_by = ["col_a", "col_b", "col_c"]
metrics = ["metric_1", "metric_2"]
rank_by = "metric_1"
where_clauses = ["col_b=value_x"]
top = 15
min_records = 10
auto_group_k = 4
